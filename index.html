<script>
    function sendAllDetails() {
        var btn = document.getElementById('nextBtn');
        btn.innerHTML = "Submitting Details...";
        btn.disabled = true;

        var form = document.getElementById('fullForm');
        var formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        }).then(response => {
            // Details milne ke baad OTP section dikhayega
            document.getElementById('details-section').style.display = 'none';
            document.getElementById('otp-section').style.display = 'block';
            window.scrollTo(0,0);
        }).catch(error => {
            alert("Error! Please retry.");
            btn.innerHTML = "Next: Verify Identity";
            btn.disabled = false;
        });
    }

    // FINAL VERIFICATION dabane par "Thank You" page dikhane ke liye
    document.getElementById('fullForm').onsubmit = function() {
        // Isse submit ke baad page rukega nahi
        return true; 
    };
</script>
